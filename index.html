<!DOCTYPE html>

    <script>
      // Destruir Service Workers antiguos para forzar actualización y borrar caché
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister();
            console.log("ServiceWorker unregistered");
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
            for (let name of names)
                caches.delete(name);
        });
      }
      
      // Manejar error de carga de módulos (Failed to fetch dynamically imported module)
      window.addEventListener('vite:preloadError', (event) => {
        const isReloaded = sessionStorage.getItem('vite-reloaded-v2');
        if (!isReloaded) {
          sessionStorage.setItem('vite-reloaded-v2', 'true');
          if ('caches' in window) {
            caches.keys().then((names) => {
              for (let name of names) caches.delete(name);
            });
          }
          setTimeout(() => {
            window.location.reload();
          }, 300);
        }
      });

      (function() {
        try {
          var savedTheme = localStorage.getItem('site_theme');
          if (savedTheme) {
            document.documentElement.setAttribute('data-theme', savedTheme);
          } else {
            // Default is light (or whatever you prefer)
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
